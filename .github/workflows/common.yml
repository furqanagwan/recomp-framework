name: recomp_common

on:
  push:
    paths:
      - "common/**"
      - "cmake/**"
      - "thirdparty/**"
      - ".github/workflows/common.yml"
  workflow_dispatch: {}

jobs:
  windows-gdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install toolchain
        run: choco install llvm cmake ninja -y

      - name: Configure
        run: >
          cmake -S common -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DRECOMP_BUILD_TESTS=ON
          -DREXSDK_DIR=${{ github.workspace }}/thirdparty/rexglue-sdk

      - name: Build
        run: >
          cmake --build build --target
          recomp_safe_guest_read_test recomp_native_renderer_test

      - name: Test
        run: ctest --test-dir build -R "recomp\.(safe_guest_read|native_renderer)" --output-on-failure
