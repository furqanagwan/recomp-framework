name: scripts

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/scripts.yml"
  pull_request:
    paths:
      - "scripts/**"

jobs:
  analysis-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Test the analysis scripts
        run: python -m pytest scripts/tests -v
